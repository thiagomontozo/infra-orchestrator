server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 1m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location /api/ { proxy_pass http://server:8080; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffering off; proxy_read_timeout 360s; }
 location /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
 location / { try_files $uri $uri/ /index.html; }
}
